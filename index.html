<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grub Guide - Discover Random Restaurants Near You</title>
    <meta name="description" content="Discover new places to eat with Grub Guide. Enter your location, set a search radius, and let us surprise you with a random restaurant nearby." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Google Maps JS API — loaded after the app bundle so it doesn't block render.
         %VITE_GOOGLE_API_KEY% is replaced at build time by Vite. -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=%VITE_GOOGLE_API_KEY%&libraries=places&loading=async"
      async
      defer
    ></script>
  </body>
</html>
